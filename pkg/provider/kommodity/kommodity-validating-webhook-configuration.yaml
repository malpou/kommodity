---
# Kommodity-owned webhook configuration. This directory is NOT regenerated by
# scripts/fetch-providers.sh (unlike pkg/provider/webhooks), so hand-authored
# manifests here survive `make generate`.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kommodity-validating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
      - v1beta1
    clientConfig:
      service:
        name: webhook-service
        namespace: system
        path: /validate-kommodity-io-self-hosted-cluster
    failurePolicy: Fail
    matchPolicy: Equivalent
    name: validation.selfhosted.cluster.kommodity.io
    rules:
      - apiGroups:
          - cluster.x-k8s.io
        apiVersions:
          - v1beta1
        operations:
          - DELETE
        resources:
          - clusters
    sideEffects: None
