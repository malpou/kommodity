# Source: https://github.com/hetznercloud/hcloud-cloud-controller-manager/blob/main/deploy/ccm.yaml
# Deployment of the cloud-controller-manager inside the cluster.
# Placed in files/ so that it can be rendered as a single manifest by the ClusterResourceSet.
# The hcloud token Secret is delivered to kube-system as "hcloud" by the kommodity
# CCM ClusterResourceSet (see kommodity.io/ccm-downstream-secret-name).
{{- $privateNetwork := and .Values.kommodity.network.ipv4.enabled (not .Values.kommodity.network.ipv4.public) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hcloud-cloud-controller-manager
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hcloud-cloud-controller-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: hcloud-cloud-controller-manager
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hcloud-cloud-controller-manager
  namespace: kube-system
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: hcloud-cloud-controller-manager
  template:
    metadata:
      labels:
        app: hcloud-cloud-controller-manager
    spec:
      serviceAccountName: hcloud-cloud-controller-manager
      dnsPolicy: Default
      tolerations:
        # Allow scheduling on uninitialized and control-plane nodes.
        - key: "node.cloudprovider.kubernetes.io/uninitialized"
          value: "true"
          effect: "NoSchedule"
        - key: "CriticalAddonsOnly"
          operator: "Exists"
        - key: "node-role.kubernetes.io/control-plane"
          effect: NoSchedule
        - key: "node.kubernetes.io/not-ready"
          effect: "NoExecute"
      containers:
        - name: hcloud-cloud-controller-manager
          image: {{ .Values.kommodity.provider.cloudControllerManager.image.repository }}:{{ .Values.kommodity.provider.cloudControllerManager.image.tag }}
          args:
            - --allow-untagged-cloud
            - --cloud-provider=hcloud
            - --route-reconciliation-period=30s
            - --webhook-secure-port=0
            - --leader-elect=false
            {{- if $privateNetwork }}
            - --allocate-node-cidrs=true
            - --cluster-cidr={{ index .Values.kommodity.network.cluster.podCIDR 0 }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HCLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hcloud
                  key: hcloud
            {{- if $privateNetwork }}
            # CAPH names the private network after the HetznerCluster.
            - name: HCLOUD_NETWORK
              value: {{ .Release.Name }}
            {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 50Mi
